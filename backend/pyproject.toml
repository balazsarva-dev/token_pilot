[project]
name = "tokenpilot"
version = "0.1.0"
description = "AI spend ledger and bill audit (OpenAI, Anthropic)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bugbear, UP: modern syntax, S: security (bandit), ERA: commented-out code
select = ["E", "F", "I", "B", "UP", "S", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # asserts are the point; fixture rows mirror real CSV lines
"migrations/versions/**" = ["E501"]  # generated DDL
