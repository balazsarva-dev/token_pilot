[[model]]
provider = "openai"
model_id = "gpt-6-astra"
display_name = "GPT-6 Astra"
family = "gpt-6"
size_tier = "large"
  [[model.price]]
  # Short-context prices (input up to 272K tokens). Longer requests cost 20 / 2 / 75; daily
  # exports cannot tell them apart, so reconciliation will show a gap if such requests exist.
  # Data-residency endpoints (+10%) are not priced. gpt-6-astra-law is a separate model.
  # Verified against the billed cost on 2026-09-05 (exact match).
  valid_from = 2026-09-01
  input_uncached = "10.00"
  input_cached = "1.00"
  output = "50.00"
  batch_discount = "0.5"
  source = "developers.openai.com/api/docs/pricing, fetched 2026-10-31"

# ------------------------------------------------------------------ Anthropic
# Source: https://platform.claude.com/docs/en/about-claude/pricing, fetched 2026-10-20.
# Batch API: 50% off input and output. Fast mode and US-only inference (1.1x) are not priced in v1.

