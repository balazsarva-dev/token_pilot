# Reviewed model catalog and price list. Loaded with `make seed` (python -m tokenpilot.cli seed-prices).
#
# Rules:
# - Prices are USD per 1M tokens, written as strings so they stay exact Decimals.
# - Every price version has a source and a valid_from date. A newer version closes the previous
#   one automatically (SCD2). Usage before the first valid_from stays unpriced — never guessed.
# - A rate that is not published is omitted: usage of that token type is then unpriced, not free.
# - aliases: raw names seen in exports (dated snapshots, Console display names).
#
# valid_from 2026-09-01: earliest date these prices were verified to apply to (sample data starts
# 2026-09-20). Extend backwards only with a source for the earlier period.

# ------------------------------------------------------------------ OpenAI
# Source: https://developers.openai.com/api/docs/pricing (Standard and Batch tiers), fetched 2026-10-20.
# Batch prices are exactly 50% of standard for these models.

[[model]]
provider = "openai"
model_id = "gpt-5.4-mini"
display_name = "GPT-5.4 mini"
aliases = ["gpt-5.4-mini-2026-03-17"]
family = "gpt-5.4"
size_tier = "small"
cheaper_alternative = "gpt-5-mini"
  [[model.price]]
  valid_from = 2026-09-01
  input_uncached = "0.75"
  input_cached = "0.075"
  output = "4.50"
  batch_discount = "0.5"
  source = "developers.openai.com/api/docs/pricing, fetched 2026-10-20"

